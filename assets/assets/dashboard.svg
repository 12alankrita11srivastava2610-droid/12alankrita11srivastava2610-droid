
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Alankrita Srivastava — Developer Dashboard</title>
  <desc id="desc">A dark terminal-inspired dashboard showing Alankrita's developer profile, skills, and projects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101820"/>
      <stop offset="55%" stop-color="#07120f"/>
      <stop offset="100%" stop-color="#101421"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#40f5bd"/>
      <stop offset="100%" stop-color="#d8ff69"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#172522"/>
      <stop offset="100%" stop-color="#101a1a"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#63e8b5" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <clipPath id="clip">
      <rect x="12" y="12" width="976" height="476" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="500" fill="url(#bg)"/>
    <rect width="1000" height="500" fill="url(#grid)"/>
    <rect x="12" y="12" width="976" height="476" rx="20" fill="none" stroke="#45e8b3" stroke-opacity=".55"/>

    <rect x="13" y="13" width="974" height="48" rx="18" fill="#111b1b"/>
    <path d="M13 44V61H987V44" fill="#111b1b"/>
    <circle cx="35" cy="36" r="5" fill="#ff6b75"/>
    <circle cx="53" cy="36" r="5" fill="#ffd166"/>
    <circle cx="71" cy="36" r="5" fill="#51e6a8"/>
    <text x="93" y="40" fill="#9eafa9" font-family="monospace" font-size="13">alankrita@developer: ~</text>
    <text x="786" y="40" fill="#64efbb" font-family="monospace" font-size="12">● ONLINE / LEARNING</text>
    <circle cx="962" cy="36" r="4" fill="#64efbb">
      <animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/>
    </circle>

    <text x="38" y="94" fill="#6cf4c1" font-family="monospace" font-size="12">$ whoami</text>
    <text x="38" y="135" fill="#f2f7f3" font-family="monospace" font-size="30" font-weight="bold">ALANKRITA</text>
    <text x="38" y="169" fill="#f2f7f3" font-family="monospace" font-size="30" font-weight="bold">SRIVASTAVA<tspan fill="#d8ff69">_</tspan></text>
    <rect x="38" y="185" width="3" height="25" fill="#d8ff69">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <text x="52" y="202" fill="#a8bab3" font-family="monospace" font-size="14">CSE STUDENT · IET LUCKNOW</text>
    <text x="38" y="237" fill="#63e8b5" font-family="monospace" font-size="13">Building things that matter.</text>
    <text x="38" y="258" fill="#9eafa9" font-family="monospace" font-size="12">Better code. Bigger dreams.</text>

    <rect x="38" y="280" width="285" height="84" rx="12" fill="url(#panel)" stroke="#2a5649"/>
    <text x="54" y="302" fill="#65edbd" font-family="monospace" font-size="11">CURRENT FOCUS</text>
    <text x="54" y="327" fill="#f2f7f3" font-family="monospace" font-size="14">Java + DSA</text>
    <text x="54" y="347" fill="#f2f7f3" font-family="monospace" font-size="14">Full Stack + AI</text>
    <path d="M285 313l8 8 15-18" fill="none" stroke="#d8ff69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="360" y="94" fill="#6cf4c1" font-family="monospace" font-size="12">$ cat tech_stack.json</text>
    <rect x="360" y="109" width="600" height="126" rx="12" fill="#101b19" stroke="#285143"/>
    <text x="380" y="134" fill="#839b91" font-family="monospace" font-size="12">{</text>
    <text x="399" y="156" fill="#d8ff69" font-family="monospace" font-size="13">"languages":</text>
    <text x="514" y="156" fill="#8cefc6" font-family="monospace" font-size="13">["Java", "Python", "JS"],</text>
    <text x="399" y="179" fill="#d8ff69" font-family="monospace" font-size="13">"frontend":</text>
    <text x="514" y="179" fill="#8cefc6" font-family="monospace" font-size="13">["HTML", "CSS", "React"],</text>
    <text x="399" y="202" fill="#d8ff69" font-family="monospace" font-size="13">"backend":</text>
    <text x="514" y="202" fill="#8cefc6" font-family="monospace" font-size="13">["Node.js", "Express"]</text>
    <text x="380" y="222" fill="#839b91" font-family="monospace" font-size="12">}</text>

    <text x="360" y="265" fill="#6cf4c1" font-family="monospace" font-size="12">$ ls ./featured_projects</text>

    <rect x="360" y="280" width="190" height="104" rx="12" fill="url(#panel)" stroke="#31594c"/>
    <rect x="360" y="280" width="190" height="3" rx="2" fill="url(#accent)"/>
    <text x="376" y="307" fill="#d8ff69" font-family="monospace" font-size="12">01 / AI</text>
    <text x="376" y="332" fill="#f2f7f3" font-family="monospace" font-size="14" font-weight="bold">Mock Interviewer</text>
    <text x="376" y="353" fill="#9eafa9" font-family="monospace" font-size="11">Interview practice</text>
    <text x="376" y="369" fill="#6ce9b9" font-family="monospace" font-size="11">React · Express</text>

    <rect x="565" y="280" width="190" height="104" rx="12" fill="url(#panel)" stroke="#31594c"/>
    <rect x="565" y="280" width="190" height="3" rx="2" fill="#d8ff69"/>
    <text x="581" y="307" fill="#d8ff69" font-family="monospace" font-size="12">02 / KNOWLEDGE</text>
    <text x="581" y="332" fill="#f2f7f3" font-family="monospace" font-size="14" font-weight="bold">Cognexa</text>
    <text x="581" y="353" fill="#9eafa9" font-family="monospace" font-size="11">AI memory assistant</text>
    <text x="581" y="369" fill="#6ce9b9" font-family="monospace" font-size="11">React · TypeScript</text>

    <rect x="770" y="280" width="190" height="104" rx="12" fill="url(#panel)" stroke="#31594c"/>
    <rect x="770" y="280" width="190" height="3" rx="2" fill="url(#accent)"/>
    <text x="786" y="307" fill="#d8ff69" font-family="monospace" font-size="12">03 / PRODUCTIVITY</text>
    <text x="786" y="332" fill="#f2f7f3" font-family="monospace" font-size="14" font-weight="bold">AI Study Planner</text>
    <text x="786" y="353" fill="#9eafa9" font-family="monospace" font-size="11">Personalized planning</text>
    <text x="786" y="369" fill="#6ce9b9" font-family="monospace" font-size="11">AI · Web app</text>

    <rect x="38" y="400" width="922" height="54" rx="10" fill="#101b19" stroke="#28493e"/>
    <text x="55" y="422" fill="#6cf4c1" font-family="monospace" font-size="12">$ git status</text>
    <text x="55" y="441" fill="#a9bcb4" font-family="monospace" font-size="12">Learning in progress · Projects evolving · Open to opportunities</text>
    <circle cx="935" cy="427" r="5" fill="#d8ff69">
      <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.45;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <rect x="14" y="0" width="972" height="3" fill="#6cf4c1" opacity=".65">
      <animate attributeName="y" values="62;488;62" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".05;.45;.05" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="720" y="474" fill="#4e8270" font-family="monospace" font-size="10">DESIGNED TO LEARN · BUILT TO GROW</text>
  </g>
</svg>
